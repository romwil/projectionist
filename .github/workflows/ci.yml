name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python package
        run: pip install ".[web,dev,mcp]"

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Frontend unit tests
        run: cd frontend && npm run test:unit

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=projectionist --cov-report=term-missing --cov-fail-under=74
          npm run test:e2e
        env:
          CI: true

  # H6: prove the shippable image builds, entrypoint starts, and /api/health answers.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release notes for Docker build
        run: |
          if [ ! -f frontend/public/release-notes.json ]; then
            ./scripts/generate-release-notes.sh
          fi
          test -f frontend/public/release-notes.json

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: projectionist:ci-smoke
          build-args: |
            PROJECTIONIST_VERSION=ci-smoke
            BUILD_DATE=${{ github.event.head_commit.timestamp || 'unknown' }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and smoke /api/health
        run: |
          cfg="$(mktemp -d)"
          docker run -d --name projectionist-ci-smoke \
            -p 8788:8788 \
            -e PROJECTIONIST_SKIP_DOTENV=1 \
            -v "${cfg}:/config" \
            projectionist:ci-smoke
          cleanup() {
            docker logs projectionist-ci-smoke 2>&1 | tail -n 80 || true
            docker rm -f projectionist-ci-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:8788/api/health" | grep -q '"status"'; then
              echo "health ok"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          exit 1
