# Weekly version updates for Python (pyproject.toml) and npm (root Playwright + frontend).
# GitHub Actions are not included — only two small workflows with infrequent pin bumps.
# Alerts + security-update PRs are enabled on the repo separately from this file.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-root-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
