<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- VIS-014 / PRIV-009: fonts are self-hosted (src/styles/00-fonts.css).
         No fonts.googleapis.com / fonts.gstatic.com request on any route. -->
    <script>
      (function () {
        try {
          var KEY = "projectionist.ui_theme";
          var LEGACY_KEY = "curatorx.ui_theme";
          var stored = localStorage.getItem(KEY);
          if (stored == null || stored === "") {
            stored = localStorage.getItem(LEGACY_KEY);
            if (stored != null && stored !== "") {
              try {
                localStorage.setItem(KEY, stored);
              } catch (migrateErr) {
                /* ignore migrate write failures */
              }
            }
          }
          stored = stored || "system";
          if (stored !== "lights_up" && stored !== "lights_down" && stored !== "system") {
            stored = "system";
          }
          var effective = stored;
          if (stored === "system") {
            effective =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "lights_up"
                : "lights_down";
          }
          var attr = effective === "lights_up" ? "lights-up" : "lights-down";
          document.documentElement.setAttribute("data-theme", attr);
          document.documentElement.style.colorScheme =
            effective === "lights_up" ? "light" : "dark";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "lights-down");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <title>Projectionist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
