services:
  projectionist:
    build: .
    image: projectionist:latest
    container_name: projectionist
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8788}:8788"
      # Lobby theater (LAN only — do not publish via public reverse proxy)
      - "${THEATER_HOST_PORT:-8791}:8791"
    environment:
      DATA_DIR: /config
      PORT: "8788"
      PROJECTIONIST_THEATER_PORT: "8791"
      TZ: ${TZ:-UTC}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_MOVIE_SECTION: ${PLEX_MOVIE_SECTION:-}
      PLEX_TV_SECTION: ${PLEX_TV_SECTION:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TVDB_API_KEY: ${TVDB_API_KEY:-}
      FANART_API_KEY: ${FANART_API_KEY:-}
      TAUTULLI_URL: ${TAUTULLI_URL:-}
      TAUTULLI_API_KEY: ${TAUTULLI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # First-owner setup for multi-user (H2): seeds the owner account so the
      # first login cannot be raced on a shared LAN.
      PROJECTIONIST_OWNER_USERNAME: ${PROJECTIONIST_OWNER_USERNAME:-${CURATORX_OWNER_USERNAME:-}}
      PROJECTIONIST_OWNER_PASSWORD: ${PROJECTIONIST_OWNER_PASSWORD:-${CURATORX_OWNER_PASSWORD:-}}
      PROJECTIONIST_SESSION_SECRET: ${PROJECTIONIST_SESSION_SECRET:-${CURATORX_SESSION_SECRET:-}}
      PROJECTIONIST_WEBHOOK_SECRET: ${PROJECTIONIST_WEBHOOK_SECRET:-${CURATORX_WEBHOOK_SECRET:-}}
      PROJECTIONIST_MCP_API_KEY: ${PROJECTIONIST_MCP_API_KEY:-${CURATORX_MCP_API_KEY:-}}
      PROJECTIONIST_MCP_FULL_API_KEY: ${PROJECTIONIST_MCP_FULL_API_KEY:-${CURATORX_MCP_FULL_API_KEY:-}}
      # Active-curation scope for the full MCP key (off by default).
      PROJECTIONIST_MCP_FULL_CONFIRM: ${PROJECTIONIST_MCP_FULL_CONFIRM:-${CURATORX_MCP_FULL_CONFIRM:-}}
      # Optional dedicated key for settings.json secret encryption (H4).
      PROJECTIONIST_SECRETS_KEY: ${PROJECTIONIST_SECRETS_KEY:-}
      PROJECTIONIST_LOG_LEVEL: ${PROJECTIONIST_LOG_LEVEL:-${CURATORX_LOG_LEVEL:-${LOG_LEVEL:-INFO}}}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    volumes:
      - ${CONFIG_PATH:-./config}:/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
